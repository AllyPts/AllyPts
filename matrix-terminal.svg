<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 360" width="100%" height="360">
  <defs>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="box-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes rain {
        0% { transform: translateY(-160px); opacity: 0; }
        25% { opacity: 0.85; }
        75% { opacity: 0.85; }
        100% { transform: translateY(370px); opacity: 0; }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .stream {
        font-family: 'Consolas', 'Courier New', monospace;
        font-size: 13px;
        fill: #00FF41;
        writing-mode: vertical-rl;
        text-orientation: upright;
        letter-spacing: 4px;
        opacity: 0.45;
      }
      .col1 { animation: rain 3.5s linear infinite; }
      .col2 { animation: rain 4.5s linear infinite 0.7s; }
      .col3 { animation: rain 3.0s linear infinite 1.4s; }
      .col4 { animation: rain 5.0s linear infinite 0.2s; }
      .col5 { animation: rain 3.8s linear infinite 1.9s; }
      .col6 { animation: rain 4.2s linear infinite 0.9s; }
      .col7 { animation: rain 3.2s linear infinite 2.2s; }
      .col8 { animation: rain 4.8s linear infinite 0.5s; }

      .term-title {
        font-family: 'Consolas', 'Courier New', monospace;
        font-size: 30px;
        font-weight: 900;
        fill: #00FF41;
        letter-spacing: 2px;
      }
      .cursor {
        animation: blink 0.8s infinite;
        fill: #00FF41;
      }
      .sub-title {
        font-family: 'Consolas', monospace;
        font-size: 16px;
        font-weight: bold;
        fill: #FFFFFF;
        letter-spacing: 1px;
      }
      .badge-label {
        font-family: 'Consolas', monospace;
        font-size: 12px;
        font-weight: bold;
        fill: #FFFFFF;
        letter-spacing: 1.5px;
      }
      .badge-val {
        font-family: 'Consolas', monospace;
        font-size: 12px;
        font-weight: 900;
        fill: #000000;
        letter-spacing: 1.5px;
      }
    </style>
  </defs>

  <!-- Fundo preto e moldura néon com cantos arredondados -->
  <rect x="5" y="5" width="840" height="350" rx="14" fill="#010803" stroke="#00FF41" stroke-width="2" filter="url(#box-glow)" />

  <!-- Chuva digital de caracteres da Matrix -->
  <g>
    <text x="35" y="0" class="stream col1">01101001010110B910A</text>
    <text x="80" y="0" class="stream col2">100111010010108DUY9</text>
    <text x="125" y="0" class="stream col3">01010100110011X764B</text>
    <text x="170" y="0" class="stream col4">11001010101100MN340</text>
    <text x="680" y="0" class="stream col5">00110101101001S980Z</text>
    <text x="725" y="0" class="stream col6">101010010110104K97E</text>
    <text x="770" y="0" class="stream col7">011100101101002688Y</text>
    <text x="815" y="0" class="stream col8">1101010100101101010</text>
  </g>

  <!-- Ícone do terminal no topo central -->
  <g transform="translate(425, 42)">
    <rect x="-20" y="-14" width="40" height="28" rx="5" fill="#001405" stroke="#00FF41" stroke-width="1.8" />
    <path d="M -9 -4 L -3 0 L -9 4 M 0 4 L 7 4" stroke="#00FF41" stroke-width="2" fill="none" stroke-linecap="round" />
  </g>

  <!-- Título principal -->
  <g filter="url(#neon-glow)">
    <text x="415" y="115" text-anchor="middle" class="term-title">Conectado na Matrix.</text>
  </g>
  <rect x="585" y="93" width="13" height="26" class="cursor" filter="url(#neon-glow)" />

  <!-- Linha divisória horizontal com brilho -->
  <line x1="80" y1="150" x2="770" y2="150" stroke="#003B00" stroke-width="1.5" />
  <line x1="280" y1="150" x2="570" y2="150" stroke="#00FF41" stroke-width="2" filter="url(#neon-glow)" />

  <!-- Subtítulo -->
  <text x="425" y="195" text-anchor="middle" class="sub-title">Terminal // System Status: Online</text>

  <!-- Painéis de estado -->
  <g transform="translate(135, 240)">
    <rect x="0" y="0" width="85" height="36" rx="6" fill="#000000" stroke="#00FF41" stroke-width="1.5" />
    <text x="42" y="23" text-anchor="middle" class="badge-label">STATUS</text>
    <rect x="85" y="0" width="125" height="36" rx="6" fill="#00FF41" filter="url(#neon-glow)" />
    <text x="147" y="23" text-anchor="middle" class="badge-val">OPERACIONAL</text>
  </g>

  <g transform="translate(365, 240)">
    <rect x="0" y="0" width="95" height="36" rx="6" fill="#000000" stroke="#00FF41" stroke-width="1.5" />
    <text x="47" y="23" text-anchor="middle" class="badge-label">SECURITY</text>
    <rect x="95" y="0" width="100" height="36" rx="6" fill="#00FF41" filter="url(#neon-glow)" />
    <text x="145" y="23" text-anchor="middle" class="badge-val">BYPASSED</text>
  </g>

  <g transform="translate(580, 240)">
    <rect x="0" y="0" width="70" height="36" rx="6" fill="#000000" stroke="#00FF41" stroke-width="1.5" />
    <text x="35" y="23" text-anchor="middle" class="badge-label">USER</text>
    <rect x="70" y="0" width="145" height="36" rx="6" fill="#00FF41" filter="url(#neon-glow)" />
    <text x="142" y="23" text-anchor="middle" class="badge-val">ALLYSON PONTES</text>
  </g>
</svg>
